[project]
name = "sodus"
version = "0.9.0"
description = "Task acceptance layer for multi-agent work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.22", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sodus = "sodus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sodus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

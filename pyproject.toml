[project]
name = "nodus"
version = "0.5.0"
description = "Task acceptance layer for multi-agent work"
requires-python = ">=3.11"
# DSH sessions are stored as multi-frame zstd JSONL; reading them is core.
dependencies = ["zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nodus = "nodus.cli:main"
# The product name. Same parser, same daemon, same database: `sodus/cli.py`
# forwards to `nodus.cli:main`. `nodus` stays the implementation name on disk.
sodus = "sodus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nodus*", "sodus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

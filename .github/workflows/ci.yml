name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is the target platform: process handling, ACLs and .cmd shims
    # all behave differently here, so CI has to run where the product runs.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: CLI answers without a daemon
        shell: pwsh
        run: |
          $version = python sodus.py --version
          if ($LASTEXITCODE -ne 0) { throw "sodus --version failed" }
          Write-Host $version
          python sodus.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "sodus --help failed" }

      - name: Every command surface loads
        shell: pwsh
        run: ./scripts/smoke_cli.ps1

# GitHub Actions: Trigger review on CI failure
# Save as: .github/workflows/review-on-failure.yml
#
# This workflow automatically triggers a sodus review when CI tests fail,
# helping diagnose why the build/tests failed.

name: Review on CI Failure

on:
  workflow_run:
    workflows: ["CI", "Tests"]  # Replace with your CI workflow names
    types:
      - completed

jobs:
  review-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sodus
        run: |
          pip install -e .
          # Or: pip install sodus

      - name: Start sodus daemon
        run: |
          python -m sodus up

      - name: Trigger review of failed run
        env:
          SODUS_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Find the most recent failed run
          LATEST_RUN=$(python -m sodus runs | grep failed | head -1 | awk '{print $1}')

          if [ -n "$LATEST_RUN" ]; then
            echo "Reviewing failed run: $LATEST_RUN"
            python -m sodus review "$LATEST_RUN" --focus "CI failure analysis" --by auto
          else
            echo "No failed runs found to review"
          fi

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-results
          path: ~/.sodus/runs/*/review.md
          if-no-files-found: ignore

      - name: Comment on PR (optional)
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewPath = `${process.env.HOME}/.sodus/runs`;
            // Read and post review results as PR comment
            // Implementation left as exercise - parse review.md and format as comment

